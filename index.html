<style>
/* Layout: Allied Press ink-green sidebar + light paper canvas; the logo's four-colour bar runs along the top; stages take the bar's colours (blue design, green production, yellow confirm, ink done) */
:root{
  --bg:#f3f5f3; --surface:#ffffff; --sunk:#eaeeeb; --ink:#12241b; --muted:#5a6a61; --line:#dbe2dd;
  --side:#12241b; --side-fg:#ecf3ee; --side-muted:#8ea79a; --side-hi:#1e3a2c;
  --accent:#11863f; --accent-fg:#ffffff; --mark:#fcd34a;
  --hi:#e0262c; --med:#c98a06; --low:#397bc0; --ok:#129a4a;
  --st-design:#397bc0; --st-prod:#129a4a; --st-confirm:#d6a512; --st-done:#12241b;
  --ap-r:#e0262c; --ap-y:#fcd34a; --ap-g:#129a4a; --ap-b:#397bc0;
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --shadow:0 1px 2px rgba(18,36,27,.06),0 2px 8px rgba(18,36,27,.05);
  --shadow-up:0 2px 4px rgba(18,36,27,.08),0 12px 26px rgba(18,36,27,.12);
  --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c120f; --surface:#141c18; --sunk:#101713; --ink:#e6eee9; --muted:#93a59b; --line:#25322b;
  --side:#08100c; --side-fg:#ecf3ee; --side-muted:#7c9488; --side-hi:#16261e;
  --accent:#3ccf7a; --accent-fg:#05180c; --mark:#fcd34a;
  --hi:#f45c5f; --med:#eab03a; --low:#6aa3e0; --ok:#3ccf7a;
  --st-design:#6aa3e0; --st-prod:#3ccf7a; --st-confirm:#f5cd4a; --st-done:#c9d6cf;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 2px 8px rgba(0,0,0,.25); --shadow-up:0 2px 6px rgba(0,0,0,.4),0 12px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c120f; --surface:#141c18; --sunk:#101713; --ink:#e6eee9; --muted:#93a59b; --line:#25322b;
  --side:#08100c; --side-fg:#ecf3ee; --side-muted:#7c9488; --side-hi:#16261e;
  --accent:#3ccf7a; --accent-fg:#05180c; --mark:#fcd34a;
  --hi:#f45c5f; --med:#eab03a; --low:#6aa3e0; --ok:#3ccf7a;
  --st-design:#6aa3e0; --st-prod:#3ccf7a; --st-confirm:#f5cd4a; --st-done:#c9d6cf;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 2px 8px rgba(0,0,0,.25); --shadow-up:0 2px 6px rgba(0,0,0,.4),0 12px 28px rgba(0,0,0,.35); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:240px minmax(0,1fr);height:100%}
/* sidebar */
.side{background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;gap:18px;padding:18px 12px;overflow-y:auto}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:4px 10px 2px}
.logo{width:92px;height:auto;display:block}
.bt{font-size:11.5px;letter-spacing:.06em;color:var(--side-muted)}
.cmyk{display:grid;grid-template-columns:repeat(2,10px);gap:2px;flex:none}
.cmyk b{width:10px;height:10px;border-radius:50%;display:block}
.cmyk b:nth-child(1){background:#00a6d6}.cmyk b:nth-child(2){background:#e0218a}.cmyk b:nth-child(3){background:#f6d000}.cmyk b:nth-child(4){background:var(--side-fg)}
.navgrp{display:flex;flex-direction:column;gap:2px}
.navlbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--side-muted);padding:0 10px 6px;display:flex;justify-content:space-between;align-items:center}
.navlbl button{background:none;border:0;color:var(--side-muted);font-size:16px;line-height:1;padding:0 2px}
.navlbl button:hover{color:var(--side-fg)}
.nav{display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:8px;padding:7px 10px;text-align:left;color:var(--side-fg);width:100%}
.nav:hover{background:var(--side-hi)}
.nav.on{background:var(--side-hi);font-weight:600}
.nav.on .n{color:var(--side-fg)}
.nav .dot{width:10px;height:10px;border-radius:3px;flex:none}
.nav .n{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--side-muted)}
.nav span.t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side input{width:100%;background:var(--side-hi);border:1px solid transparent;border-radius:8px;padding:7px 10px;color:var(--side-fg)}
.side input::placeholder{color:var(--side-muted)}

/* main */
.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:22px 24px 0}
.top h1{font-family:var(--f-display);font-size:26px;letter-spacing:-.2px;font-weight:700;margin:0;text-wrap:balance;display:flex;align-items:center;gap:10px;min-width:0}
.top h1 .dot{width:14px;height:14px;border-radius:4px;flex:none}
.top .grow{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--hi);border-color:color-mix(in srgb,var(--hi) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.tabs{display:flex;gap:4px;padding:14px 24px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;color:var(--muted);font-weight:500;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.tabs .sp{flex:1}
.chk{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;white-space:nowrap;padding:0 4px}
.canvas{flex:1;overflow:auto;padding:20px 24px 40px;position:relative}
.banner{margin:12px 24px 0;padding:8px 12px;border-radius:8px;background:color-mix(in srgb,var(--mark) 18%,var(--surface));font-size:13px}

/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:16px;align-items:start;min-height:100%}
.col{--sc:var(--muted);background:color-mix(in srgb,var(--sc) 5%,var(--sunk));border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:140px;border:2px dashed transparent;border-top:3px solid var(--sc)}
.col.over{border-color:var(--accent)}
.colh{display:flex;align-items:center;gap:8px;padding:4px 4px 6px;font-family:var(--f-display);font-weight:600;font-size:15px}
.colh .n{font-family:var(--f-mono);font-size:11.5px;font-weight:500;color:var(--ink);background:color-mix(in srgb,var(--sc) 16%,transparent);padding:0 8px;border-radius:999px;margin-left:auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow);cursor:pointer;text-align:left;width:100%;transition:transform .12s ease,box-shadow .12s ease,border-color .12s}
.card:hover{transform:translateY(-1px);box-shadow:var(--shadow-up);border-color:color-mix(in srgb,var(--sc) 45%,var(--line))}
.card.dragging{opacity:.4}
.card .tt{font-weight:500;overflow-wrap:anywhere;line-height:1.4}
.card.done .tt{color:var(--muted);text-decoration:line-through}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.meta .r{margin-left:auto}
.addbtn{background:none;border:0;color:var(--muted);text-align:left;padding:6px 8px;border-radius:8px}
.addbtn:hover{background:var(--surface);color:var(--ink)}
.board .addbtn{border:1px dashed color-mix(in srgb,var(--sc) 35%,var(--line));text-align:center}
.qadd{width:100%;border:1px solid var(--accent);border-radius:10px;padding:9px 12px;background:var(--surface)}

/* chips */
.prio{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;background:color-mix(in srgb,currentColor 12%,transparent);white-space:nowrap}
.prio.high{color:var(--hi)}.prio.med{color:var(--med)}.prio.low{color:var(--low)}
.due{font-family:var(--f-mono);font-size:11px;white-space:nowrap;padding:1px 7px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.due.late{color:var(--hi);background:color-mix(in srgb,var(--hi) 12%,transparent)}.due.soon{color:var(--med);background:color-mix(in srgb,var(--med) 14%,transparent)}
.pchip{display:inline-flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis}
.pchip i{width:8px;height:8px;border-radius:2px;flex:none}
.av{width:22px;height:22px;border-radius:50%;background:var(--sunk);border:1px solid var(--line);display:inline-block;overflow:hidden;flex:none;vertical-align:middle}
.av img{width:100%;height:100%;display:block}
.av.none{border-style:dashed}

/* list */
.lsec{margin-bottom:22px}
.lsech{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:600;font-size:16px;padding:4px 0 8px;border-bottom:1px solid var(--line)}
.lsech .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.lhead,.row{display:grid;grid-template-columns:28px minmax(0,1fr) 150px 70px 90px 70px;align-items:center;gap:10px;padding:8px 6px}
.lhead{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:0}
.row{border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--surface)}
.row .tt{overflow-wrap:anywhere}
.row.done .tt{color:var(--muted);text-decoration:line-through}
.tick{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--muted);background:none;display:grid;place-items:center;padding:0;color:transparent;font-size:12px}
.tick:hover{border-color:var(--ok);color:var(--ok)}
.tick.on{background:var(--ok);border-color:var(--ok);color:var(--accent-fg)}
.lwrap{overflow-x:auto}

/* calendar */
.calh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.calh b{font-family:var(--f-display);font-size:18px;min-width:150px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(110px,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);min-width:770px}
.calwrap{overflow-x:auto}
.cal .wd{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--sunk)}
.cell{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;display:flex;flex-direction:column;gap:3px;background:var(--surface)}
.cell.out{background:var(--sunk)}
.cell.out .d{opacity:.45}
.cell .d{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);padding:2px 4px}
.cell.today .d{color:var(--accent-fg);background:var(--accent);border-radius:6px;align-self:flex-start}
.ev{font-size:12px;border:0;text-align:left;border-radius:5px;padding:2px 6px;background:var(--sunk);border-left:3px solid var(--c,var(--accent));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.done{text-decoration:line-through;color:var(--muted)}

/* attachments */
.cover{width:100%;max-height:150px;object-fit:cover;border-radius:6px;display:block;background:var(--sunk)}
.fc{font-size:11.5px;color:var(--muted);white-space:nowrap;font-weight:400;text-decoration:none;display:inline-block}
.files{display:flex;flex-direction:column;gap:8px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.th{position:relative;aspect-ratio:1;max-width:100%;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sunk)}
.th .img{border:0;padding:0;background:none;display:block;width:100%;height:100%;cursor:zoom-in}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .pdf{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:100%;padding:8px;text-align:center;color:var(--ink);text-decoration:none;font-size:11px;overflow:hidden}
.th .pdf b{font-family:var(--f-mono);color:var(--hi);font-size:15px}
.th .pdf span{overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}
.th.up{display:grid;place-items:center;font-size:12px;color:var(--muted);text-align:center;padding:6px}
.thx{position:absolute;top:4px;right:4px;border:0;border-radius:6px;background:rgba(0,0,0,.62);color:#fff;padding:2px 8px;font-size:13px;line-height:1.4}
.thx.yes{background:var(--hi);font-size:12px}
.drop{position:relative;display:flex;flex-direction:column;gap:2px;border:1.5px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--muted);font-size:12.5px;cursor:pointer}
.drop b{color:var(--accent);font-size:14px}
.drop:hover,.panel.dropping .drop{border-color:var(--accent);color:var(--ink);background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.drop input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.drop:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.mini{display:inline-flex;gap:3px;align-items:center}
.mini img,.mini .pdfb{width:28px;height:28px;border-radius:4px;object-fit:cover;border:1px solid var(--line);display:block}
.mini .pdfb{display:inline-grid;place-items:center;font-size:8px;font-family:var(--f-mono);color:var(--hi);background:var(--surface)}
.mini .more{font-size:11px;color:var(--muted)}
.mini button{border:0;padding:0;background:none;cursor:zoom-in;display:inline-flex}
.lb{position:fixed;inset:0;background:rgba(8,12,10,.88);z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.lb img{max-width:100%;max-height:calc(100% - 60px);object-fit:contain;border-radius:6px;background:#fff}
/* team */
.av.ini{display:inline-grid;place-items:center;color:#fff;font-size:10.5px;font-weight:600;border:0;line-height:1}
.memrow{display:flex;align-items:center;gap:2px}
.memrow .nav{flex:1;min-width:0}
.memx{background:none;border:0;color:var(--side-muted);padding:4px 7px;border-radius:6px;opacity:0;font-size:15px;line-height:1}
.memrow:hover .memx,.memx:focus-visible,.memx.yes{opacity:1}
.memx:hover{color:var(--side-fg)}
.memx.yes{color:#fff;background:var(--hi);font-size:12px;padding:4px 8px}
@media (hover:none){.memx{opacity:1}}
.sidehint{font-size:12px;color:var(--side-muted);padding:0 10px;margin:0}
.memadd input{margin-top:6px;width:100%;border:1px dashed var(--line);border-radius:8px;padding:6px 8px;background:var(--surface)}
#whoami{border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:var(--surface);max-width:140px}
.lb[hidden],.toast[hidden]{display:none}
/* widget mode */
.wmode .side,.wmode .mbar,.wmode .top,.wmode .tabs,.wmode #banner{display:none}
.wmode .app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr)}
body.wmode .canvas{padding:0 0 20px}
body.wmode .canvas>*:not(.board){margin-left:0;margin-right:0}
.wh{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:12px;background:var(--side);color:var(--side-fg);padding:16px 14px 12px}
.wlogo{width:46px;height:auto;flex:none}
.wdate{display:flex;flex-direction:column;line-height:1.3;min-width:0;flex:1}
.wdate b{font-family:var(--f-display);font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wdate span{font-size:11px;color:var(--side-muted);display:flex;align-items:center;gap:5px}
.live{width:7px;height:7px;border-radius:50%;background:var(--ap-g);box-shadow:0 0 0 0 var(--ap-g);animation:live 2.4s ease-out infinite}
@keyframes live{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ap-g) 70%,transparent)}70%,100%{box-shadow:0 0 0 7px transparent}}
.wh .btn{background:var(--side-hi);color:var(--side-fg);border:0;font-size:12px;padding:6px 10px;white-space:nowrap}
.wbody{padding:12px 14px;display:flex;flex-direction:column;gap:14px}
.wbody .stats{gap:6px;flex-wrap:wrap;margin:0;padding:0;overflow:visible}
.wbody .stat{min-width:0;flex:1 1 calc(33% - 6px);padding:6px 9px}
.wbody .stat b{font-size:18px}
.wbody .stat .lbl{font-size:11px}
.wadd input{width:100%;border:1.5px dashed var(--line);border-radius:10px;padding:9px 12px;background:var(--surface)}
.wadd input:focus{border-style:solid;border-color:var(--accent);outline:none}
.wsec{display:flex;flex-direction:column;gap:5px}
.wsech{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:600;font-size:14px;background:none;border:0;padding:4px 2px;width:100%;text-align:left;color:var(--ink)}
.wsech .n{margin-left:auto;font-family:var(--f-mono);font-size:11px;font-weight:500;background:color-mix(in srgb,var(--sc,var(--muted)) 16%,transparent);padding:0 8px;border-radius:999px}
.wsech .chev{font-size:11px;color:var(--muted);transition:transform .2s var(--ease);display:inline-block;width:12px}
.wsec.closed .chev{transform:rotate(-90deg)}
.wsec.urgent .wsech{color:var(--hi)}
.wsec.urgent .n{--sc:var(--hi)}
.wsec.urgent.calm .wsech{color:var(--muted)}
.wrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--sc);border-radius:8px;padding:8px 8px 8px 10px;cursor:pointer;transition:transform .12s,box-shadow .12s}
.wrow:hover{box-shadow:var(--shadow-up);transform:translateY(-1px)}
.wrow .wt{flex:1 1 140px;min-width:0;font-size:13.5px;overflow-wrap:anywhere;line-height:1.35}
.wrow .wt small{display:block;font-size:11px;color:var(--muted)}
.wrow .av{width:20px;height:20px}
.wnext{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:2px 8px;font-size:11px;color:var(--muted);white-space:nowrap}
.wnext:hover{border-color:var(--sc);color:var(--ink);background:color-mix(in srgb,var(--sc) 12%,var(--surface))}
.wcalm{margin:0;padding:6px 2px;font-size:12.5px;color:var(--muted)}
.wfoot{margin:4px 0 0;font-size:11.5px;color:var(--muted);text-align:center}
.intro .wrow,.intro .wsec{animation:rise .45s var(--ease) both}
.wtoggle{font-size:13px;white-space:nowrap}
.stats,.board{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--muted) 35%,transparent) transparent}
.stats{scrollbar-width:none}.stats::-webkit-scrollbar{display:none}

/* overlay: nothing but blocks */
html:has(body.omode),body.omode,.omode .app,.omode .main,.omode .canvas{background:transparent!important}
.omode #bgfx,.omode .wh,.omode .wbody>.stats,.omode .wadd,.omode .wfoot,.omode .wcalm,.omode .wsec.calm,.omode .wsec.nil{display:none!important}
.omode .canvas{scrollbar-width:none;padding:0!important}
.omode .canvas::-webkit-scrollbar{display:none}
.omode .wbody{padding:6px 6px 2px;gap:8px}
.omode .wsec{gap:4px}
.omode .wsech{display:inline-flex;width:auto;align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 10px 2px 8px;font-size:12.5px;gap:6px}
.omode .wsech .n{margin-left:4px}
.omode .wrow,.omode .quick,.omode .wrow:hover{box-shadow:none}
.omode .wrow:hover{transform:none;border-color:var(--sc)}
.omode .quick{margin-bottom:0}
.omode .app::before,.omode .qsub,.omode .qempty{display:none!important}

.omode .qbody{padding:0 10px 10px;gap:6px}
.omode .qtimes{gap:4px;font-size:11.5px}
.omode .qtimes button{padding:1px 8px;font-size:11.5px}
.osolid,.osolid .app{background:var(--bg)!important}

/* ---- summary view ---- */
.sum{display:flex;flex-direction:column;gap:16px;max-width:1200px}

.mchip:hover{color:var(--ink);transform:translateY(-1px)}

.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}

.scard:nth-child(2){animation-delay:.06s}.scard:nth-child(3){animation-delay:.12s}.scard:nth-child(4){animation-delay:.18s}.scard:nth-child(5){animation-delay:.24s}
.scard>span{font-size:12.5px;color:var(--muted)}
.scard b{font-family:var(--f-display);font-size:28px;line-height:1.15}
.scard small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scard small.up{color:#1f9d5a;font-weight:600}.scard small.down{color:#e5484d;font-weight:600}
.scard.hero{background:linear-gradient(140deg,#2fb46a,#137a45);color:#fff;box-shadow:0 12px 28px rgba(31,157,90,.3)}

.spd{font-style:normal;align-self:flex-start;font-size:11px;font-weight:600;padding:1px 9px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,#fff);white-space:nowrap}

.spanel{background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);border-radius:22px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}

.hotb,.ageb{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:1px 9px 1px 7px;border-radius:999px}
.hotb{color:#c4282d;background:#ffe8e8;border:1px solid #f6b7b9}
.ageb{color:#6b6250;background:#efe9db;border:1px dashed #c9bfa6}
.bell{width:11px;height:11px;background:#e5484d;-webkit-mask:url("data:image/svg+xml,%3Csvg xmlns='http:%2F%2Fwww.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2a7 7 0 0 0-7 7v4l-2 3v1h18v-1l-2-3V9a7 7 0 0 0-7-7zm0 21a3 3 0 0 0 3-3H9a3 3 0 0 0 3 3z'/%3E%3C/svg%3E") center/contain no-repeat;mask:url("data:image/svg+xml,%3Csvg xmlns='http:%2F%2Fwww.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2a7 7 0 0 0-7 7v4l-2 3v1h18v-1l-2-3V9a7 7 0 0 0-7-7zm0 21a3 3 0 0 0 3-3H9a3 3 0 0 0 3 3z'/%3E%3C/svg%3E") center/contain no-repeat;transform-origin:50% 10%;animation:ringbell 2.4s ease-in-out infinite}
@keyframes ringbell{0%,60%,100%{transform:rotate(0)}66%{transform:rotate(18deg)}72%{transform:rotate(-16deg)}78%{transform:rotate(12deg)}84%{transform:rotate(-8deg)}90%{transform:rotate(4deg)}}
/* ---- cobweb on long-standing cards ---- */
.card.old{filter:saturate(.7);border-style:dashed!important}
.card.old2{filter:saturate(.45) sepia(.12)}
.web{position:absolute;right:0;top:0;width:52px;height:52px;color:rgba(90,90,80,.55);pointer-events:none;z-index:2}
.web svg{width:100%;height:100%;display:block}
.old2 .web{width:70px;height:70px}
.spider{position:absolute;right:30px;top:0;width:1px;height:26px;background:rgba(90,90,80,.5);transform-origin:top;animation:dangle 3.4s ease-in-out infinite;pointer-events:none;z-index:2}
.spider i{position:absolute;left:-4px;bottom:-6px;width:9px;height:8px;border-radius:50%;background:#3b3b36}
.spider i::before,.spider i::after{content:"";position:absolute;left:-4px;right:-4px;top:2px;height:1px;background:#3b3b36;transform:rotate(18deg)}
.spider i::after{transform:rotate(-18deg);top:5px}
@keyframes dangle{0%,100%{transform:scaleY(1) rotate(2deg)}50%{transform:scaleY(1.45) rotate(-3deg)}}

/* ---- send-by pill ---- */
.from{display:inline-flex;align-items:center;gap:5px;background:#fff;border-radius:999px;padding:2px 9px 2px 3px;font-size:11.5px;font-weight:600;color:var(--ink);white-space:nowrap;box-shadow:0 1px 3px rgba(20,60,40,.06)}
.from .av{width:18px;height:18px;font-size:9px}
/* ---- urgent: flaming border + fire cat ---- */
@property --fa{syntax:'<angle>';inherits:false;initial-value:0deg}
.th-glass .card.hot{overflow:visible;margin-top:26px;border:2px solid transparent!important;background:linear-gradient(#fff6f0,#fff6f0) padding-box,conic-gradient(from var(--fa),#ffd166,#ff7a1f,#e5484d,#ff7a1f,#ffd166) border-box;animation:firespin 3s linear infinite;box-shadow:0 8px 26px rgba(255,110,40,.22)}
.th-glass .card.hot::after{display:none}
@keyframes firespin{to{--fa:360deg}}
.card.hot>*:not(.firecat):not(.spark):not(.web):not(.spider):not(.ribbon){position:relative;z-index:1}
.card.hot>.firecat,.card.hot>.spark{position:absolute!important}
.card.hot .tt{padding-right:40px}
.firecat{position:absolute;right:12px;top:-36px;width:46px;height:52px;z-index:3;transform-origin:50% 100%;animation:bob 1.4s ease-in-out infinite;pointer-events:none}
.firecat svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 0 6px rgba(255,140,40,.55))}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-3px) scale(.95,1.06)}}
.ftuft{transform-box:fill-box;transform-origin:50% 100%;animation:tuft .45s ease-in-out infinite alternate}
@keyframes tuft{from{transform:scale(.85,.8) rotate(-8deg)}to{transform:scale(1.05,1.15) rotate(8deg)}}
.ftail{transform-box:fill-box;transform-origin:0% 90%;animation:ftail 1.2s ease-in-out infinite}
@keyframes ftail{50%{transform:rotate(-14deg) scaleY(1.08)}}
.feye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
.card .spark{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffc23d;box-shadow:0 0 6px #ff7a1f;opacity:0;animation:spk 1.8s ease-out infinite;z-index:3;pointer-events:none}
.card .spark.s1{right:22px;top:-30px}.card .spark.s2{right:44px;top:-16px;animation-delay:.6s}.card .spark.s3{right:10px;top:-10px;animation-delay:1.2s}
@keyframes spk{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}100%{opacity:0;transform:translate(-8px,-26px)}}
.hotb{color:#fff!important;background:linear-gradient(135deg,#ff9a3c,#e5484d)!important;border:0!important;box-shadow:0 4px 12px rgba(229,72,77,.3)}
.mini{width:10px;height:13px;display:inline-block}.mini svg{width:100%;height:100%;display:block}
/* ---- full-width logo banner ---- */
.th-glass .brand{position:relative;display:flex;flex-direction:row;align-items:center;gap:12px;padding:12px 14px;margin:0;border-radius:20px;background:linear-gradient(135deg,#2fb46a 0%,#178a4f 60%,#0f6b3c 100%);color:#fff;box-shadow:0 12px 26px rgba(31,157,90,.3),inset 0 1px 0 rgba(255,255,255,.35);overflow:hidden}
.th-glass .brand::before{content:"";position:absolute;inset:0;background:radial-gradient(120px 60px at 85% 0%,rgba(255,255,255,.28),transparent 70%),radial-gradient(circle at 1px 1px,rgba(255,255,255,.12) 1px,transparent 0) 0 0/10px 10px;pointer-events:none}
.th-glass .brand::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-120%);animation:shine 6s ease-in-out infinite 1s;pointer-events:none}
.th-glass .brand .logo{width:62px;flex:none;background:none;padding:0;border-radius:0;box-shadow:none;animation:none;position:relative}
.btx{display:none}
.th-glass .btx{display:flex;flex-direction:column;line-height:1.2;position:relative;min-width:0}
.th-glass .btx b{font-family:var(--f-display);font-size:20px;letter-spacing:.2px}
.th-glass .btx small{font-size:11px;color:#d6f5e2}

/* ===== desktop widgets: liquid glass ===== */
@property --dwh{syntax:'<angle>';inherits:false;initial-value:0deg}
html:has(body.dw),body.dw,.dw .app,.dw .main,.dw .canvas{background:transparent!important}
.dw #bgfx,.dw #skyfx,.dw #themefx{display:none!important}
.dw .app{margin:0!important;height:100%!important;border:0!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;border-radius:0!important}
.dw .canvas{padding:0!important;overflow:auto;scrollbar-width:none}
.dw .canvas::-webkit-scrollbar{display:none}
.dwgrid{display:grid;grid-template-columns:330px 330px;gap:22px;padding:28px;align-items:start;color:#1d1b26}
.dwg{position:relative;border-radius:30px;padding:18px;isolation:isolate;
 background:linear-gradient(135deg,rgba(255,255,255,.42),rgba(255,255,255,.14) 55%,rgba(255,255,255,.26));
 box-shadow:inset 0 1.5px 1px rgba(255,255,255,.95),inset 0 -1.5px 2px rgba(255,255,255,.35),inset 3px 0 10px rgba(255,255,255,.3),inset -3px 0 10px rgba(255,255,255,.18);animation:dwin .8s cubic-bezier(.2,.7,.2,1) both}
.dwsolid .dwg{background:linear-gradient(135deg,rgba(255,255,255,.96),rgba(246,244,252,.92))}
.dwg::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;z-index:-1;background:conic-gradient(from var(--dwh),rgba(255,255,255,.95),rgba(168,150,255,.85),rgba(120,220,210,.85),rgba(255,180,210,.85),rgba(255,255,255,.95));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:dwhue 8s linear infinite}
@keyframes dwhue{to{--dwh:360deg}}
.dwg::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:radial-gradient(140px 70px at 20% 0%,rgba(255,255,255,.65),transparent 70%),linear-gradient(115deg,transparent 40%,rgba(255,255,255,.32) 50%,transparent 60%);background-size:100% 100%,250% 100%;animation:dwsheen 7s ease-in-out infinite}
@keyframes dwsheen{0%,100%{background-position:0 0,120% 0}50%{background-position:0 0,-20% 0}}
@keyframes dwin{from{opacity:0;transform:translateY(16px) scale(.97)}}
.dwg:nth-child(2){animation-delay:.08s}.dwg:nth-child(3){animation-delay:.16s}.dwg:nth-child(4){animation-delay:.24s}
.dwg.wide{grid-column:span 2}
.dwg h3{margin:0 0 12px;font-family:var(--f-display);font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;text-shadow:0 1px 2px rgba(255,255,255,.7)}
.dwg h3 .n{margin-left:auto;min-width:26px;text-align:center;font-family:var(--f-mono);font-size:12px;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.75);box-shadow:inset 0 1px 1px #fff,0 2px 6px rgba(70,60,110,.1);animation:none!important;color:#1d1b26}
.orb{width:24px;height:24px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fff,var(--c) 70%);box-shadow:0 4px 10px color-mix(in srgb,var(--c) 45%,transparent),inset 0 -2px 3px rgba(0,0,0,.08)}
.dwclock{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 24px}
.dwclock .t{font-family:var(--f-display);font-size:64px;font-weight:600;line-height:1;letter-spacing:-2px;background:linear-gradient(120deg,#2a2640,#5b4fc7 50%,#2bb3a0);-webkit-background-clip:text;background-clip:text;color:transparent}
.dwclock .t small{font-size:20px;letter-spacing:0;margin-left:4px;-webkit-text-fill-color:#6f6b80}
.dwclock .d{font-size:14px;color:#4d4960;margin-top:6px;text-shadow:0 1px 2px rgba(255,255,255,.8)}
.dwsync{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#4d4960;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.65);box-shadow:inset 0 1px 1px #fff,0 4px 10px rgba(70,60,110,.08);white-space:nowrap}
.dwsync .live{width:8px;height:8px;border-radius:50%;background:#3cc7a6}
.dwtiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.dwtile{position:relative;border-radius:22px;padding:12px 14px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;background:linear-gradient(150deg,color-mix(in srgb,var(--c) 45%,#fff),color-mix(in srgb,var(--c) 78%,#fff));color:#fff;box-shadow:inset 0 1.5px 1px rgba(255,255,255,.8),inset 0 -6px 12px color-mix(in srgb,var(--c) 40%,transparent),0 10px 20px color-mix(in srgb,var(--c) 30%,transparent);transition:transform .3s}
.dwtile:hover{transform:translateY(-3px)}
.dwtile::after{content:"";position:absolute;left:10%;right:10%;top:4px;height:38%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.5),transparent);pointer-events:none}
.dwtile b{font-family:var(--f-display);font-size:34px;line-height:1;text-shadow:0 2px 6px rgba(0,0,0,.14)}
.dwtile span{font-size:12px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.18)}
.dw #quick{margin:0;border:0;overflow:visible}
.dw #quick .qbody{display:flex!important;flex-direction:column;gap:10px;padding:0}
.dwqin{display:flex;gap:8px}
.dwqin input{flex:1;min-width:0;border:0;border-radius:999px;padding:11px 16px;background:rgba(255,255,255,.88);box-shadow:inset 0 1px 2px rgba(70,60,110,.08),0 4px 12px rgba(70,60,110,.08)}
.dwqin input:focus{outline:2px solid rgba(139,124,246,.5)}
.dw .plus{width:42px;height:42px;border-radius:50%;border:0;color:#fff;font-size:22px;font-weight:600;background:radial-gradient(circle at 35% 30%,#b3a8ff,#7a69f0 70%);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.7),0 8px 18px rgba(122,105,240,.4);flex:none}
.dw .qtimes{gap:6px;color:#4d4960}
.dw .qtimes button{border:0;border-radius:999px;padding:5px 12px;font-size:12px;background:rgba(255,255,255,.6);box-shadow:inset 0 1px 1px #fff,0 2px 6px rgba(70,60,110,.08);color:#4d4960}
.dw .qtimes button.on{color:#fff;background:linear-gradient(135deg,#5fd8bd,#2bb3a0);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.6),0 6px 14px rgba(43,179,160,.35)}
.dw .qlist{gap:8px;max-height:300px;overflow:auto;scrollbar-width:none}
.dw .qi{border-radius:20px;padding:9px 10px;background:rgba(255,255,255,.7);box-shadow:inset 0 1px 1px #fff,0 4px 12px rgba(70,60,110,.07);color:#1d1b26}
.dw .qi.due{background:rgba(255,236,238,.92);box-shadow:0 0 0 2px rgba(229,72,77,.45),0 6px 16px rgba(229,72,77,.18)}
.dw .qtick{border-radius:50%;width:26px;height:26px}
.dw .qi.done .qtick{background:radial-gradient(circle at 35% 30%,#b3a8ff,#7a69f0 70%);border-color:transparent}
.dw .qempty{color:#4d4960}
.dwlist{display:flex;flex-direction:column;gap:8px;max-height:330px;overflow:auto;scrollbar-width:none;padding:2px}
.dwi{position:relative;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:20px;background:rgba(255,255,255,.7);box-shadow:inset 0 1px 1px #fff,0 4px 12px rgba(70,60,110,.07);cursor:pointer;color:#1d1b26}
.dwi .tx{flex:1;min-width:0;line-height:1.35;overflow-wrap:anywhere}
.dwi .tx small{display:block;font-size:10.5px;color:#6f6b80;margin-top:2px}
.dwi.hot{background:linear-gradient(#fff7f2,#fff7f2) padding-box,conic-gradient(from var(--fa),#ffd166,#ff7a1f,#e5484d,#ff7a1f,#ffd166) border-box;border:2px solid transparent;animation:firespin 3s linear infinite;box-shadow:0 8px 20px rgba(255,110,40,.2)}
.fcat{width:26px;height:30px;flex:none;animation:bob 1.4s ease-in-out infinite;transform-origin:50% 100%}
.fcat svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 0 4px rgba(255,140,40,.6))}
.dwi .tag{font-size:10.5px;font-weight:700;color:#fff;border-radius:999px;padding:1px 8px;background:linear-gradient(135deg,#ff9a3c,#e5484d);margin-right:4px}

.dw .go{width:30px;height:30px;border-radius:50%;border:0;flex:none;padding:0;font-weight:700;color:#7a69f0;background:rgba(255,255,255,.9);box-shadow:inset 0 0 0 1.5px rgba(139,124,246,.45),0 4px 10px rgba(122,105,240,.15)}

.dw .alert .ah b{font-size:17px}.dw .alert p{font-size:16px}

/* ---- lite mode for touch tablets/phones: same look, far less GPU work ---- */
html.lite *,html.lite *::before,html.lite *::after{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
html.lite body.th-glass .app{background:rgba(255,255,255,.86)!important}
html.lite .th-glass .side{background:rgba(255,255,255,.6)}
html.lite .th-glass .stat,html.lite .th-glass .colh,html.lite .th-glass .spanel,html.lite .th-glass .scard{background:#fff}
html.lite .th-glass .card::after,html.lite .th-glass .btn.pri::after,html.lite .th-glass .brand::after,html.lite .th-glass .quick::before{display:none!important}
html.lite .th-glass .top h1,html.lite .th-glass .brand .logo,html.lite .th-glass .colh .sdot,html.lite .th-glass .qpin{animation:none!important}
html.lite .th-glass .top h1{color:#0f3a24;-webkit-text-fill-color:#0f3a24;background:none}
html.lite .th-glass .card:hover{transform:none}

#whogate{position:fixed;inset:0;z-index:95;display:grid;place-items:center;padding:16px;background:rgba(15,40,25,.35);backdrop-filter:blur(6px);animation:fadein .3s ease}
#whogate .wg{width:min(440px,100%);background:#fff;border-radius:26px;padding:22px;box-shadow:0 30px 80px rgba(10,40,20,.3);text-align:center}
#whogate h2{margin:0 0 4px;font-family:var(--f-display);font-size:22px}
#whogate p{margin:0 0 16px;color:var(--muted);font-size:13.5px}
.wgl{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.wgb{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;border-radius:18px;border:1.5px solid var(--line);background:#f7fbf8;font-size:15px;transition:all .2s}
.wgb:hover,.wgb:focus-visible{border-color:#1f9d5a;background:#eaf7ef;transform:translateY(-2px)}
.wgb .av{width:48px!important;height:48px!important;font-size:18px}
.wgself input{width:100%;margin-top:14px;border:1px dashed var(--line);border-radius:12px;padding:9px 12px}
.wgx{margin-top:10px;border:0;background:none;color:var(--muted);font-size:12.5px;text-decoration:underline}
/* background canvas sits behind the app */
#bgfx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.app{z-index:1}
/* งานแทรก (sticky note) */
.quick{margin-bottom:16px;border-radius:12px;background:color-mix(in srgb,var(--ap-y) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--ap-y) 55%,var(--line));box-shadow:var(--shadow);overflow:hidden}
.qh{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:10px 12px;text-align:left;color:var(--ink)}
.qh b{font-family:var(--f-display);font-size:15px}
.qpin{width:10px;height:10px;border-radius:50%;background:var(--ap-r);box-shadow:0 0 0 3px color-mix(in srgb,var(--ap-r) 22%,transparent);flex:none}
.qsub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.qbadge{margin-left:auto;font-family:var(--f-mono);font-size:11px;padding:1px 8px;border-radius:999px;background:color-mix(in srgb,var(--ink) 9%,transparent);white-space:nowrap}
.qbadge.due{background:var(--hi);color:#fff;animation:pulse 1.6s ease-in-out infinite}
.quick .chev{font-size:11px;color:var(--muted);transition:transform .2s var(--ease)}
.quick.closed .chev{transform:rotate(-90deg)}
.quick.closed .qbody{display:none}
.qbody{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px}
.qform input{width:100%;border:1px solid color-mix(in srgb,var(--ap-y) 55%,var(--line));border-radius:9px;padding:8px 11px;background:var(--surface)}
.qform input:focus{outline:2px solid color-mix(in srgb,var(--ap-y) 80%,var(--ink));outline-offset:0}
.qtimes{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:12px;color:var(--muted)}
.qtimes button{border:1px solid color-mix(in srgb,var(--ink) 14%,transparent);background:color-mix(in srgb,var(--surface) 70%,transparent);border-radius:999px;padding:2px 10px;font-size:12px}
.qtimes button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.qlist{display:flex;flex-direction:column;gap:4px}
.qi{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;background:color-mix(in srgb,var(--surface) 75%,transparent);border:1px solid transparent}
.qi .qt{flex:1;min-width:0;font-size:13.5px;overflow-wrap:anywhere;line-height:1.35}
.qwhen{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.qwhen.soon{color:var(--med)}.qwhen.late{color:var(--hi);font-weight:600}
.qi.due{border-color:color-mix(in srgb,var(--hi) 45%,transparent);background:color-mix(in srgb,var(--hi) 9%,var(--surface));animation:nudge 2.4s ease-in-out infinite}
.qi.done .qt{text-decoration:line-through;color:var(--muted)}
.qtick{width:22px;height:22px;border-radius:6px;border:1.5px solid color-mix(in srgb,var(--ink) 35%,transparent);background:var(--surface);padding:0;font-size:12px;color:transparent;flex:none;display:grid;place-items:center}
.qtick:hover{border-color:var(--ok);color:var(--ok)}
.qi.done .qtick{background:var(--ok);border-color:var(--ok);color:#fff}
.qmini{border:0;background:none;font-size:11.5px;color:var(--muted);padding:3px 6px;border-radius:6px;white-space:nowrap}
.qmini:hover{background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink)}
.qmini.x{font-size:15px;line-height:1}
.qempty{margin:0;font-size:12.5px;color:var(--muted)}
.qclear{align-self:flex-start;border:0;background:none;font-size:12px;color:var(--muted);text-decoration:underline;padding:2px 0}
.quick.ring{animation:ring .9s var(--ease)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--hi) 55%,transparent)}50%{box-shadow:0 0 0 5px transparent}}

/* sheet sync */

.av.avp{border:0;overflow:hidden}.av.avp img{width:100%;height:100%;object-fit:cover;display:block}

.setup{max-width:560px;margin:40px auto;display:flex;flex-direction:column;gap:14px;align-items:flex-start}

.setup form{display:flex;gap:8px;width:100%}

.stats{flex-basis:100%;display:flex;flex-wrap:wrap;gap:8px}
.stat{--sc:var(--muted);display:flex;flex-direction:column;gap:0;padding:8px 14px 8px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);min-width:110px}

.panel{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.12);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .2s ease;z-index:20;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html.hw .ordreset{background:rgba(255,255,255,.1);color:#ffb067;border-color:rgba(255,255,255,.16)}
html.hw.lite .th-glass .top h1{color:#ffb067;-webkit-text-fill-color:#ffb067}
html.hw .th-glass .quick::before{background:radial-gradient(circle,rgba(255,138,42,.45),transparent 65%)!important}
html.hw{background:#07040c}
html.hw .stg{background:linear-gradient(#120b1c 78%,rgba(18,11,28,0))}
html.hw .stg button{background:rgba(255,255,255,.1);color:var(--ink);box-shadow:none}
html.hw .stg button.on{background:var(--sc);color:#fff}
html.hw .th-glass .sumbtn{background:rgba(255,255,255,.1);color:#ffb067;box-shadow:none}
html.hw .addbtn{background:transparent;color:var(--muted)}
html.hw .panel{background:#1a1324;color:var(--ink)}
html.hw #drvnote{background:#241a33;color:var(--ink)}html.hw #drvnote b{color:#ffd37a}html.hw #drvnote small{color:var(--muted)}html.hw #drvnote button{background:rgba(255,255,255,.1);color:var(--ink)}

#hwfx{position:fixed;inset:0;z-index:30;pointer-events:none;overflow:hidden}
#hwfx .web{position:absolute;width:64px;height:64px;color:rgba(255,255,255,.4)}
#hwfx .w1{left:14px;top:14px;transform:scaleX(-1)}#hwfx .w2{right:14px;top:14px}
#hwfx .bat{position:absolute;left:0;top:6%;width:26px;height:14px;color:#a678e8;animation:hwfly 17s linear infinite}
#hwfx .bat svg{width:100%;height:100%;display:block;animation:hwflap .28s ease-in-out infinite alternate;transform-origin:50% 60%}
#hwfx .b2{top:13%;width:20px;height:11px;animation-duration:23s;animation-delay:-9s;color:#ff9a3c}
#hwfx .b3{top:3%;width:32px;height:17px;animation-duration:29s;animation-delay:-18s}
@keyframes hwfly{0%{transform:translate(-8vw,0)}25%{transform:translate(22vw,18px)}50%{transform:translate(52vw,-4px)}75%{transform:translate(80vw,20px)}100%{transform:translate(112vw,2px)}}
@keyframes hwflap{from{transform:scaleY(1)}to{transform:scaleY(.45)}}
html.hwcalm #hwfx .bat,html.hwcalm #hwfx .bat svg{animation:none}
@media (max-width:760px){#hwfx .web{display:none}}
@media (prefers-reduced-motion:reduce){#hwfx .bat,#hwfx .bat svg{animation:none}}

.th-glass .card.hot{margin-top:0!important}
.th-glass .card.hot .tt{padding-right:0}
.th-glass .card.hot .fxb{padding-right:0;align-items:center}
.fxb .firecat{position:static;width:46px;height:46px;margin:-6px -2px -8px auto;flex:none;animation:none;transform:none}
.fxb .firecat svg{filter:drop-shadow(0 2px 4px rgba(255,120,40,.45))}
.fl1,.fl2,.fl3{transform-box:fill-box;transform-origin:50% 100%}

.fl2{animation:flick 0.8s ease-in-out infinite alternate-reverse}
.fl3{animation:flick 0.6s ease-in-out infinite alternate}
.fcb{animation:fcbob 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{from{transform:scale(.94,.9)}to{transform:scale(1.04,1.07)}}
@keyframes fcbob{50%{transform:translateY(-1.5px)}}
.web,.spider{z-index:0}
.card .ordbtn:not(.off){background-color:#fff}
.fxb .firecat{width:52px;height:52px}
.ordrow{position:relative;z-index:1}
html.lite .fl1,html.lite .fl2,html.lite .fl3,html.lite .fcb{animation:none}
body .xchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid transparent;white-space:normal;line-height:1.3;max-width:100%;border-radius:12px}
body .xchip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
body .xchip.n0{background:#e3eefb;color:#24598f;border-color:#bcd3ee}
body .xchip.n1{background:#fff1d6;color:#8a5d00;border-color:#f0d9a6}
body .xchip.n2{background:#fde3e3;color:#b4161c;border-color:#f3b5b8}
body .xchip.ok{background:#dff5e8;color:#137a45;border-color:#b6e3c8}
body .xchip.n1::before,body .xchip.n2::before{animation:subpulse 1.3s ease-out infinite}
.xblk{display:grid;gap:10px;border:1px solid var(--line);border-radius:14px;padding:12px;margin:6px 0;background:rgba(255,255,255,.45)}
.xblk h4{margin:0;font:600 14px var(--f-display);display:flex;justify-content:space-between;gap:8px;align-items:center}
.xblk .xg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.xblk label{font-size:12.5px}
.xblk,.xopenrow{grid-column:1/-1;min-width:0}
.xblk textarea{display:block;width:100%;height:92px;min-height:92px;font-size:13.5px;line-height:1.5;resize:vertical}
.xblk .btn,.xopenrow .btn{padding:5px 12px;font-size:13px;min-height:34px;width:auto;flex:0 0 auto}
.xblk label{display:grid;gap:4px;min-width:0}
.xblk input{width:100%;min-width:0}
.xblk .xrow{display:flex;gap:6px;flex-wrap:wrap}
.xopenrow{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
body .xbtn{display:inline-flex;width:auto!important;flex:0 0 auto;align-items:center;margin:0;font:inherit;font-size:12px;font-weight:600;border:1px dashed var(--line);background:rgba(255,255,255,.7);color:var(--muted);border-radius:12px;padding:2px 9px;cursor:pointer;line-height:1.3}
body .xbtn:hover{border-color:var(--accent);color:var(--accent)}
body .xbtn.go{border-style:solid;background:#fff;color:#137a45}

.subchip{gap:6px}
.subchip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.subchip.act::before{animation:subpulse 1.3s ease-out infinite}
.subchip.wait::before{display:none}
.subchip.wait::after{content:"";order:2;height:4px;width:12px;background:radial-gradient(circle,currentColor 1.6px,transparent 2px) 0 50%/4px 4px repeat-x;animation:subdots 1.4s steps(4,end) infinite}
body .subchip.act{background-image:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.65) 50%,transparent 70%);background-size:220% 100%;background-repeat:no-repeat;animation:subshine 2.6s ease-in-out infinite}
@keyframes subpulse{0%{box-shadow:0 0 0 0 rgba(31,157,90,.55)}80%,100%{box-shadow:0 0 0 7px rgba(31,157,90,0)}}
@keyframes subdots{0%{width:0}100%{width:12px}}
@keyframes subshine{0%{background-position:160% 0}60%,100%{background-position:-60% 0}}
.subseg button.on{animation:subpop .3s var(--ease)}
@keyframes subpop{0%{transform:scale(.94)}60%{transform:scale(1.04)}100%{transform:none}}
#ldbar{position:fixed;left:0;right:0;top:0;height:3px;z-index:120;overflow:hidden;opacity:0;pointer-events:none;transition:opacity .25s}
#ldbar::after{content:"";position:absolute;top:0;bottom:0;width:38%;border-radius:3px;background:linear-gradient(90deg,transparent,#1f9d5a,#7ad6a4,transparent);animation:ldrun 1.1s ease-in-out infinite}
body.syncing #ldbar{opacity:1}
@keyframes ldrun{0%{left:-40%}100%{left:102%}}
#ldpill{position:fixed;left:50%;top:max(12px,env(safe-area-inset-top));transform:translate(-50%,-90px);z-index:121;display:flex;align-items:center;gap:9px;padding:9px 16px;border-radius:999px;background:#fff;color:#0f3a24;font-weight:600;font-size:14px;box-shadow:0 8px 26px rgba(20,60,40,.22);transition:transform .35s var(--ease);pointer-events:none}
#ldpill i{width:16px;height:16px;border-radius:50%;border:2.5px solid #b6e3c8;border-top-color:#1f9d5a;animation:ldspin .8s linear infinite}
body.loading1 #ldpill{transform:translate(-50%,0)}
@keyframes ldspin{to{transform:rotate(360deg)}}
#drvnote{position:fixed;right:16px;bottom:16px;z-index:60;max-width:310px;display:grid;gap:3px;padding:12px 14px 12px 16px;border-radius:14px;background:#fff;border-left:5px solid #e0a02c;box-shadow:0 10px 30px rgba(20,40,30,.22);font-size:13px;line-height:1.45;color:#2a3a32;animation:drvin .4s var(--ease)}
#drvnote b{font-size:14px;color:#6b4a00}#drvnote small{color:#6b7b73}
#drvnote div{display:flex;gap:8px;margin-top:6px}
#drvnote a,#drvnote button{font:inherit;font-weight:600;font-size:13px;padding:6px 12px;border-radius:999px;border:0;cursor:pointer;text-decoration:none;min-height:0}
#drvnote a{background:#1f9d5a;color:#fff}#drvnote button{background:#eef2ef;color:#2a3a32}
@keyframes drvin{from{opacity:0;transform:translateY(14px)}}
@media (max-width:760px){#drvnote{left:12px;right:12px;max-width:none;bottom:calc(12px + env(safe-area-inset-bottom))}}
@media (prefers-reduced-motion:reduce){.subchip,.subchip::before,.subchip::after,#ldbar::after{animation:none!important}.subchip.wait::after{width:12px}}
@media (max-width:760px){
  html.lite .cat,.catsit,.brandcat{display:none!important}
  .mbar{padding:max(10px,env(safe-area-inset-top)) 12px 10px;gap:8px;z-index:30}
  .mbar .logo{width:44px}
  .mbar select{font-size:15px;padding:8px 10px}
  .canvas{padding:0 0 calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
  .top{padding:12px 14px 4px;gap:6px 10px;flex-wrap:nowrap;align-items:center}
  .top h1{font-size:20px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top .greet,.top .paw,.top .sub,.top .motbtn{display:none!important}
  .top .btn.pri{padding:8px 14px;min-height:38px;font-size:15px;flex:none}
  .stats{display:none!important}
  .canvas>.tabs,.tabs{padding:4px 14px 6px;gap:8px;border:0}
  .tabs .sumbtn{padding:7px 12px;min-height:0;font-size:14px}
  .tabs select{font-size:15px;padding:6px 8px}
  .stg{position:sticky;top:0;z-index:20;margin:0!important;padding:8px 14px 10px;background:linear-gradient(#f3faf6 78%,rgba(243,250,246,0));gap:8px}
  .stg button{padding:9px 14px;font-size:15px;min-height:40px}
  .board{grid-auto-columns:100%!important;gap:0!important;padding:0!important;margin-top:0!important;scroll-padding:0!important;scroll-snap-type:x mandatory;scroll-snap-stop:always}
  .col{padding:2px 14px 0!important;gap:10px;min-width:0}
  .colh{display:none!important}
  .card{padding:11px 13px!important;border-radius:16px}
  .card .ptag,.card .cdesc{font-size:13px}
  .col .addbtn{min-height:46px}
  .ordbtns button,.ordrow button{min-width:36px;min-height:36px}
}

.subchip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.subchip.act{background:#dff5e8;color:#137a45;border-color:#b6e3c8}
.subchip.wait{background:#fff1d6;color:#8a5d00;border-color:#f0d9a6}
.ordrow{flex-wrap:wrap}
.subseg{flex-wrap:wrap}
.th .pdfdl{position:absolute;left:5px;bottom:5px;z-index:2;display:inline-grid;place-items:center;min-width:26px;height:24px;padding:0 7px;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-size:11px;font-weight:600;text-decoration:none}
.th .pdf{padding-bottom:30px}
.pb>*{flex-shrink:0}
.ptitle{min-height:76px}
.memname{cursor:default}.memname:hover{background:transparent!important;transform:none}
.ordrow{display:flex;align-items:center;gap:6px;margin:-2px 0}
.ordrow .sp{flex:1}
.ordn{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:rgba(20,35,27,.09);color:var(--ink);font-size:12px;font-weight:700}
.ordn.first{background:#137a45;color:#fff}
.ordrow em{font-style:normal;font-size:12px;font-weight:600;color:#137a45}
.ordbtn{display:inline-grid;place-items:center;width:26px;height:24px;border-radius:8px;background:rgba(255,255,255,.85);border:1px solid var(--line);font-size:10px;color:var(--muted);cursor:pointer;user-select:none}
.ordbtn:hover{color:var(--ink);background:#fff}
.ordbtn.off{opacity:.25;pointer-events:none}
.ordreset{margin-left:auto;font-size:11.5px;font-weight:600;color:#137a45;background:rgba(255,255,255,.8);border:1px solid var(--line);border-radius:999px;padding:3px 9px;cursor:pointer}
@media (pointer:coarse){.ordbtn{width:36px;height:32px;font-size:12px}.ordreset{padding:6px 12px}}
.menubtn{display:none}.hb{display:grid;gap:4px}.hb i{width:18px;height:2px;background:currentColor;border-radius:2px}
.mscrim{display:none}.stg{display:none}
@media (max-width:1024px){
  .menubtn{display:inline-flex;align-items:center;justify-content:center;background:var(--side-hi);color:var(--side-fg);border:0;width:40px;height:40px;min-height:0;padding:0;border-radius:10px;flex:none}
  .side{display:flex!important;position:fixed;z-index:50;top:0;bottom:0;left:0;width:min(84vw,320px);transform:translateX(-106%);transition:transform .25s ease;margin:0!important;border-radius:0 24px 24px 0!important;box-shadow:0 0 40px rgba(10,30,20,.28);padding:26px 14px 20px;visibility:hidden}
  body.menu-open .side{transform:none;visibility:visible}
  .mscrim{display:block;position:fixed;inset:0;z-index:49;background:rgba(10,30,20,.38);opacity:0;pointer-events:none;transition:opacity .2s}
  body.menu-open .mscrim{opacity:1;pointer-events:auto}
  .th-glass .side{background:rgba(247,252,249,.97)}
  .sumbtn{white-space:nowrap;flex:none}
  .tabs{flex-wrap:wrap;gap:8px}
  .wtoggle,.motbtn{display:none}
}
@media (max-width:760px){
  .stg{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
  .stg::-webkit-scrollbar{display:none}
  .stg button{flex:none;border:0;border-radius:999px;padding:9px 14px;background:rgba(255,255,255,.85);font:inherit;font-weight:600;font-size:14px;color:var(--ink);box-shadow:0 2px 8px rgba(20,60,40,.08);display:inline-flex;align-items:center;gap:7px}
  .stg button i{width:9px;height:9px;border-radius:50%;background:var(--sc)}
  .stg button b{font-weight:600;opacity:.6}
  .stg button.on{background:var(--sc);color:#fff}.stg button.on i{background:#fff}
}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes arrive{0%{transform:scale(.97);box-shadow:0 0 0 0 color-mix(in srgb,var(--sc) 55%,transparent)}45%{transform:scale(1.015);box-shadow:0 0 0 6px color-mix(in srgb,var(--sc) 28%,transparent)}100%{transform:none;box-shadow:var(--shadow)}}
@keyframes bump{0%{transform:none}35%{transform:scale(1.08)}100%{transform:none}}
@keyframes toastin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes zoomin{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes seg{0%,100%{transform:scaleY(.35);opacity:.5}50%{transform:scaleY(1);opacity:1}}
.intro .col,.intro .stat{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0)*60ms + var(--d,0ms))}
.intro .card,.intro .row{animation:rise .5s var(--ease) both;animation-delay:calc(180ms + var(--d,0ms) + var(--i,0)*45ms)}
.intro .side .nav,.intro .brand{animation:fadein .5s var(--ease) both;animation-delay:.25s}
.canvas.swap>*{animation:fadein .28s var(--ease) both}
.card.arrive,.row.arrive{animation:arrive .7s var(--ease)}
.row.arrive{--sc:var(--accent)}
.stat.bump b{display:inline-block;animation:bump .45s var(--ease)}
.toast:not([hidden]){animation:toastin .25s var(--ease)}
.lb:not([hidden]){animation:fadein .2s ease}
.lb:not([hidden]) img{animation:zoomin .25s var(--ease)}
.panel.fresh .pb>*{animation:fadein .35s var(--ease) both}
.panel.fresh .pb>*:nth-child(2){animation-delay:40ms}.panel.fresh .pb>*:nth-child(3){animation-delay:80ms}.panel.fresh .pb>*:nth-child(4){animation-delay:120ms}.panel.fresh .pb>*:nth-child(n+5){animation-delay:160ms}
.panel{transition:transform .32s var(--ease)}
.scrim{transition:opacity .25s}
.nav,.btn,.tab,.mpill,.seg button,.addbtn,.ev{transition:background-color .15s,border-color .15s,color .15s,transform .1s}
.btn:active,.mpill:active,.seg button:active,.addbtn:active{transform:scale(.97)}
.col{transition:background-color .15s,border-color .15s}
.col.over{border-color:var(--sc);background:color-mix(in srgb,var(--sc) 14%,var(--sunk))}
.card.dragging{opacity:.45;transform:rotate(-1.5deg)}
.ink{position:fixed;width:9px;height:9px;border-radius:50%;pointer-events:none;z-index:60}
.loadbar{display:flex;gap:4px;height:22px;align-items:center}
.loadbar i{width:16px;height:22px;border-radius:3px;animation:seg 1s ease-in-out infinite}
.loadbar i:nth-child(1){background:var(--ap-r)}.loadbar i:nth-child(2){background:var(--ap-y);animation-delay:.12s}.loadbar i:nth-child(3){background:var(--ap-g);animation-delay:.24s}.loadbar i:nth-child(4){background:var(--ap-b);animation-delay:.36s}
/* stage buttons */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px;white-space:nowrap}
.seg button:hover:not(:disabled){border-color:var(--sc)}
.seg button.on{border-color:var(--sc);background:color-mix(in srgb,var(--sc) 16%,var(--surface));font-weight:600}
/* phone agenda */
.agenda{display:flex;flex-direction:column;gap:10px}
.aday{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:start}
.adate{display:flex;flex-direction:column;align-items:center;padding:6px 0;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.adate b{font-family:var(--f-display);font-size:20px;line-height:1.1}
.adate span{font-size:11px;color:var(--muted)}
.aday.today .adate{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.aday.today .adate span{color:var(--accent-fg)}
.aday.past .adate{opacity:.6}
.aevs{display:flex;flex-direction:column;gap:6px;min-width:0}
.aevs .ev{display:flex;flex-direction:column;gap:0;white-space:normal;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);font-size:14px}
.aevs .ev small{font-size:11px;color:var(--muted)}
.intro .aday{animation:rise .45s var(--ease) both;animation-delay:calc(var(--i,0)*50ms)}
@media (prefers-reduced-motion:reduce) and (max-width:0px){*,*::before,*::after{animation:none!important;transition:none!important}}

async function shrink(f){

    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bm,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.88));return b&&b.size<f.size?b:f;

/* ---------- monthly archive ---------- */
// Done tasks move out of `tasks` into archive/<YYYY-MM>_<n> once their completion month has passed.
// meta/archive keeps the index: {months:{'2026-09':{count,chunks}}}
const clone=o=>JSON.parse(JSON.stringify(o));
function doneTs(t){return t.completedAt||(t.due?new Date(t.due+'T12:00').getTime():t.createdAt)||Date.now()}
const monthOf=ts=>ymd(new Date(ts)).slice(0,7);
const monthLabel=m=>new Date(m+'-01T00:00').toLocaleDateString('th-TH',{month:'long',year:'numeric'});
const monthShort=m=>new Date(m+'-01T00:00').toLocaleDateString('th-TH',{month:'short',year:'2-digit'});

async function archiveOld(){
  if(!db||!canWrite()||A.busy)return;
  const cur=TODAY().slice(0,7);
  const elig=S.tasks.filter(t=>t.status==='done'&&monthOf(doneTs(t))<cur);
  if(!elig.length)return;
  A.busy=true;
  try{
    const lock=await db.doc('meta/archive-lock').acquire({holder:S.me||newId(),ttlMs:60000});
    if(!lock.acquired)return; // someone else is archiving right now
    const is=await db.doc('meta/archive').get();
    const idx=is.exists?clone(is.data()):{};idx.months=idx.months||{};
    const groups={};elig.forEach(t=>{const m=monthOf(doneTs(t));(groups[m]=groups[m]||[]).push(t)});
    let moved=0;
    for(const m of Object.keys(groups).sort()){
      const ent=idx.months[m]||{count:0,chunks:0};
      let n=Math.max(ent.chunks,1),ref=db.doc('archive/'+m+'_'+n);
      const cs=await ref.get();let body=cs.exists?clone(cs.data()):{month:m,tasks:{}};body.tasks=body.tasks||{};
      for(const t of groups[m]){
        const {id,...rest}=t;
        const rec={...rest,completedAt:doneTs(t),projectName:(proj(t.projectId)||{}).name||''};
        if(JSON.stringify(body).length+JSON.stringify(rec).length>CHUNK_MAX){await ref.set(body);n++;ref=db.doc('archive/'+m+'_'+n);body={month:m,tasks:{}}}
        if(!body.tasks[id])ent.count++;
        body.tasks[id]=rec;
      }
      await ref.set(body);
      ent.chunks=n;idx.months[m]=ent;
      await db.doc('meta/archive').set(idx);
      for(const t of groups[m]){await db.doc('tasks/'+t.id).delete();moved++}
    }
    toast(`ย้ายงานที่เสร็จแล้ว ${moved} ชิ้นเข้าคลังรายเดือน`);
  }catch(e){fail(e)}finally{A.busy=false}
}
async function loadMonth(m){

  const ent=(A.index.months||{})[m];const out=[];

      const s=await db.doc('archive/'+m+'_'+n).get();

async function downloadMonth(btn){

  let missing=0;

    if(zip)for(const [i,f] of (t.files||[]).entries()){

function archView(items){

(function bgfx(){return;

  }
  function mk(y){const types=['sheet','sheet','reg','dots','check','sheet'];
    return {t:types[Math.floor(Math.random()*types.length)],x:Math.random()*W,y,s:14+Math.random()*22,r:(Math.random()-.5)*.6,vr:(Math.random()-.5)*.0025,vy:.12+Math.random()*.22,c:COLS[Math.floor(Math.random()*4)],ph:Math.random()*6.28}}

      const x=(b.x+Math.sin(t*b.f+b.ph)*.12)*W,y=(b.y+Math.cos(t*b.f*1.3+b.ph)*.1)*H,r=b.r*Math.max(W,H);

function diffNow(){

  for(const x of S.tasks)if(c.t[x.id]!==b.t[x.id])d.tasks.push(x);
  for(const id in b.t)if(!(id in c.t))d.deleteTasks.push(id);

}

function mergeArr(srv,local,cols,sent){

    if(now[x.id]!==sent[x.id]){const l=local.find(y=>y.id===x.id);if(l)out.push(l)}  // edited or deleted here meanwhile

  return out;

  let h=`<div class="calh"><button class="btn" data-act="mprev" aria-label="เดือนก่อน">‹</button><b>${esc(label)}</b><button class="btn" data-act="mnext" aria-label="เดือนถัดไป">›</button><button class="btn ghost" data-act="mtoday">วันนี้</button><span class="small">${noDue?`มี ${noDue} งานที่ยังไม่กำหนดวันส่ง`:''}</span></div><div class="calwrap"><div class="cal">`;

  const weeks=Math.ceil((m.getDay()+new Date(m.getFullYear(),m.getMonth()+1,0).getDate())/7);
  for(let i=0;i<weeks*7;i++){
    const d=addDays(start,i),k=ymd(d);
    const evs=ts.filter(t=>t.due===k);
    h+=`<div class="cell ${d.getMonth()!==m.getMonth()?'out':''} ${k===today?'today':''}"><span class="d">${d.getDate()}</span>${evs.map(t=>`<button class="ev ${t.status==='done'?'done':''}" style="--c:${(STATUSES.find(x=>x.id===t.status)||STATUSES[0]).c}" data-act="open" data-id="${esc(t.id)}" title="${esc(t.title)}">${esc(t.title)}</button>`).join('')}</div>`;
  }
  return h+`</div></div>`;
}

function agendaHtml(ts){
  const m=S.month,today=TODAY(),key=ymd(m).slice(0,7);
  const label=m.toLocaleDateString('th-TH',{month:'long',year:'numeric'});
  let h=`<div class="calh"><button class="btn" data-act="mprev" aria-label="เดือนก่อน">‹</button><b>${esc(label)}</b><button class="btn" data-act="mnext" aria-label="เดือนถัดไป">›</button><button class="btn ghost" data-act="mtoday">วันนี้</button></div>`;

async function fzLoad(force){

  if(FZ.rows===null){try{FZ.rows=JSON.parse(localStorage.getItem(fzOnline()?'wn-fuji-cache':'wn-fuji')||'[]').map(fzNorm)}catch(e){FZ.rows=[]};try{FZ.lists=JSON.parse(localStorage.getItem(fzOnline()?'wn-fuji-lists-c':'wn-fuji-lists')||'null')}catch(e){FZ.lists=null};FZ.dirty=true}
  if(!fzOnline()){FZ.lastLoad=Date.now();if(S.view==='fuji')fzDirty();return}
  if(!force&&Date.now()-FZ.lastLoad<20000){return}
  FZ.loading=true;
  try{
    await fzFlush();

    let rows=(j.fuji||[]).map(fzNorm);
    if(FZQ.length){const m=new Map(rows.map(r=>[r.id,r]));FZQ.forEach(q=>{(q.u||[]).forEach(r=>m.set(r.id,r));(q.d||[]).forEach(id=>m.delete(id))});rows=[...m.values()]}

      if(FZQ.length){const m=new Map(L.map(x=>[x.id,x]));FZQ.forEach(q=>{(q.l||[]).forEach(x=>m.set(x.id,x));(q.dl||[]).forEach(id=>m.delete(id))});L=[...m.values()]}

async function fzFlush(){
  if(!fzOnline()||fzBusy||!FZQ.length)return;
  fzBusy=true;
  const n=FZQ.length,up=new Map(),del=new Set(),ul=new Map(),dl=new Set();
  FZQ.slice(0,n).forEach(q=>{(q.u||[]).forEach(r=>{up.set(r.id,r);del.delete(r.id)});(q.d||[]).forEach(id=>{del.add(id);up.delete(id)});(q.l||[]).forEach(x=>{ul.set(x.id,x);dl.delete(x.id)});(q.dl||[]).forEach(id=>{dl.add(id);ul.delete(id)})});
  try{await gsCall({action:'fujiSave',fuji:[...up.values()],deleteFuji:[...del],lists:[...ul.values()],deleteLists:[...dl]});FZQ.splice(0,n);try{localStorage.setItem('wn-fuji-q',JSON.stringify(FZQ))}catch(e){}}

}

function fzBarSvg(W,items,okc,grid){
  const H=190,pl=40,pr=6,pt=12,pb=24,iw=W-pl-pr,ih=H-pt-pb;
  const max=fzNice(Math.max(1,...items.map(i=>i.ok+i.fail))),n=items.length,step=iw/n,bw=Math.max(2,Math.min(26,step*.68)),ev=Math.max(1,Math.ceil(26/step));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟแท่ง">`;
  for(let i=0;i<=4;i++){const y=pt+ih-ih*i/4;s+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="${grid}"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${fzNf(max*i/4)}</text>`}
  const lab=new Set(step>=20?items.map((_,i)=>i):items.map((it,i)=>[it.ok+it.fail,i]).sort((a,b)=>b[0]-a[0]).slice(0,6).map(x=>x[1]));
  items.forEach((it,i)=>{
    const x=pl+step*i+(step-bw)/2,hk=ih*it.ok/max,hf=ih*it.fail/max,yk=pt+ih-hk,yf=yk-hf;
    s+=`<g class="hit" data-i="${i}" data-tip="${esc(it.tip)}"><rect x="${pl+step*i}" y="${pt}" width="${step}" height="${ih}" fill="transparent"/>`;
    if(it.ok)s+=`<rect x="${x}" y="${yk}" width="${bw}" height="${hk}" rx="${bw>6?2:0}" style="fill:${okc}"/>`;
    if(it.fail)s+=`<rect x="${x}" y="${yk-hf}" width="${bw}" height="${Math.max(hf,1.5)}" rx="${bw>6?2:0}" style="fill:#e5484d"/>`;
    s+='</g>';if(i%ev===0)s+=`<text x="${x+bw/2}" y="${H-7}" text-anchor="middle">${it.label}</text>`;
    const tt=it.ok+it.fail;
    if(tt&&lab.has(i))s+=`<text class="val" x="${x+bw/2}" y="${yf-4}" text-anchor="middle" style="font-size:${step<30?9:10.5}px">${step<30?fzK(tt):fzNf(tt)}</text>`;
  });
  return s+'</svg>';
}
function fzBar(el,items,onclick){

function fzLine(el,items,onclick){

  const max=fzNice(Math.max(1,...items.map(i=>i.v))*1.15),n=items.length,step=n>1?iw/(n-1):iw,X=i=>pl+(n>1?step*i:iw/2),Y=v=>pt+ih-ih*v/max;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟเส้น %เสีย">`;
  for(let i=0;i<=4;i++){const y=pt+ih-ih*i/4;s+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${(max*i/4).toFixed(max<5?1:0)}%</text>`}

const SUM={month:null,cache:{},loading:null};
const curMonth=()=>TODAY().slice(0,7);
const dDays=t=>t.createdAt&&t.completedAt?Math.max(0,(t.completedAt-t.createdAt)/864e5):null;
const SPEEDS=[{k:'vf',l:'เร็วมาก',max:1,c:'#1f9d5a'},{k:'f',l:'เร็ว',max:3,c:'#5cb84a'},{k:'n',l:'ปกติ',max:7,c:'#3fb5a0'},{k:'s',l:'ช้า',max:14,c:'#e2ad35'},{k:'vs',l:'ช้ามาก',max:1e9,c:'#e5484d'}];
const speedOf=d=>d==null?null:SPEEDS.find(x=>d<=x.max);
const fmtD=d=>d==null?'-':d<1?Math.max(1,Math.round(d*24))+' ชม.':(d<10?d.toFixed(1).replace(/\.0$/,''):Math.round(d))+' วัน';
function sumList(m){if(m===curMonth())return S.tasks.filter(t=>t.status==='done'&&t.completedAt&&ymd(new Date(t.completedAt)).slice(0,7)===m);return SUM.cache[m]||null}
async function sumLoad(){
  const m=SUM.month||curMonth();
  if(m===curMonth()||SUM.cache[m]||SUM.loading===m)return;
  SUM.loading=m;
  try{const j=await gsCall({action:'month',month:m});SUM.cache[m]=j.tasks||[]}catch(e){SUM.cache[m]=[];toast('โหลดข้อมูลเดือนนี้ไม่ได้ ลองใหม่อีกครั้ง')}
  SUM.loading=null;if(S.view==='arch')renderCanvas();
}
function sumStats(list){
  const items=list.map(t=>({t,d:dDays(t)})),timed=items.filter(x=>x.d!=null).sort((a,b)=>a.d-b.d);
  const avg=timed.length?timed.reduce((a,x)=>a+x.d,0)/timed.length:null;
  let on=0,late=0,nod=0;
  for(const x of items){if(!x.t.due){nod++;continue}if(ymd(new Date(x.t.completedAt))<=x.t.due)on++;else late++}
  const per={};for(const x of timed){const k=x.t.assignee||'';(per[k]=per[k]||[]).push(x.d)}
  const mix={};for(const x of timed){const s=speedOf(x.d);mix[s.k]=(mix[s.k]||0)+1}
  return{n:items.length,timed,avg,on,late,nod,per,mix};
}

  if(S.me){
    QREF=db.doc('data/users/'+S.me+'/quick');
    const local=S.quick.slice();let firstQ=true;
    QREF.onSnapshot(sn=>{
      const d=sn.exists?sn.data():null;
      if(firstQ){firstQ=false;if(!d&&local.length){saveQuick(local);return}}
      if(!qBusy&&!qPending){S.quick=(d&&Array.isArray(d.items))?d.items.map(x=>({...x})):[];renderQuickAll();checkQuickDue()}
    },()=>{});
  }
  let gotP=false,gotT=false;
  const ready=()=>{let first=false;if(gotP&&gotT&&S.mode==='loading'){S.mode='live';first=true;setTimeout(archiveOld,800)}render();if(first)startIntro()};
  db.doc('meta/team').onSnapshot(s=>{
    const d=s.exists?s.data():null;S.team=(d&&Array.isArray(d.members))?d.members.map(m=>({...m})):[];
    if(S.whoami&&!member(S.whoami)&&s.metadata&&!s.metadata.fromCache){S.whoami=null;S.mine=false}
    if(S.mode!=='loading')render();
  },()=>{});
  db.doc('meta/archive').onSnapshot(s=>{
    const prev=JSON.stringify(A.index);A.index=s.exists?s.data():{};
    if(S.view==='arch'&&prev!==JSON.stringify(A.index)){if(A.month)loadMonth(A.month);else renderCanvas()}
  },()=>{});
  db.collection('projects').onSnapshot(s=>{S.projects=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));if(!['all','mine'].includes(S.pid)&&!S.pid.startsWith('who:')&&!proj(S.pid))S.pid='all';gotP=true;ready()},err);
  db.collection('tasks').onSnapshot(s=>{S.tasks=s.docs.map(d=>{const x={id:d.id,...d.data()};x.status=normStatus(x.status);return x});gotT=true;ready()},err);
  function err(e){toast('การเชื่อมต่อข้อมูลขาดหาย รีเฟรชหน้าเพื่อเชื่อมต่อใหม่')}
})();
</script>
</body></html>
